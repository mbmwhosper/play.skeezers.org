<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="The Skeezers browser game library.">
  <title>Skeezers — game library</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./"><span class="brand-mark">S</span><span>Skeezers</span></a>
    <span id="summary">Loading games…</span>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">THE SKEEZERS ARCADE</p>
      <h1>Pick a game.</h1>
      <p>One fast library that remembers where you left off.</p>
      <div class="hero-actions">
        <button id="randomGame" type="button">Play something random</button>
        <button id="continueGame" class="quiet" type="button" disabled>Resume last game</button>
      </div>
    </section>

    <section class="search-bar" aria-label="Search the game library">
      <label>
        <span class="sr-only">Search games</span>
        <input id="search" type="search" placeholder="Search games…" autocomplete="off">
      </label>
    </section>

    <section class="library" aria-labelledby="libraryTitle">
      <div class="library-heading">
        <h2 id="libraryTitle">Games</h2>
        <span id="gameCount"></span>
      </div>
      <div id="gameList" class="game-list" aria-live="polite"></div>
      <p id="emptyState" class="empty" hidden>No games match that search.</p>
    </section>
  </main>

  <footer>
    <span>© <span id="year"></span> Skeezers</span>
    <span>Press <kbd>/</kbd> to search.</span>
  </footer>

  <section id="player" class="player hidden" aria-label="Game player">
    <header class="player-header">
      <button id="backBtn" type="button">← Library</button>
      <strong id="nowPlaying"></strong>
      <div class="player-actions">
        <select id="aspectRatio" aria-label="Player aspect ratio">
          <option value="fill">Fill</option>
          <option value="16:9">16:9</option>
          <option value="4:3">4:3</option>
        </select>
        <button id="reportBroken" class="quiet" type="button">Report broken</button>
        <button id="openExternal" class="quiet" type="button">Open in new tab</button>
      </div>
    </header>
    <div class="frame-wrap" id="frameWrap">
      <iframe id="gameFrame" title="Game player" allowfullscreen loading="eager"></iframe>
    </div>
  </section>

  <dialog id="detailsModal" class="details-modal">
    <div id="detailsContent"></div>
    <form method="dialog" class="dialog-close"><button type="submit">Close</button></form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/catalog-v2.js"></script>
  <script src="js/storage-compat.js"></script>
  <script src="js/routes-compat.js"></script>
  <script src="js/proxy-engine.js"></script>
  <script src="js/index.js" defer></script>
</body>
</html>
